##############################################
# Database Connection Settings
# ----------------------------
# Configure Spring Boot to connect with MySQL.
# - url: JDBC connection string
# - username/password: database credentials
# - driver-class-name: MySQL driver
##############################################
spring.datasource.url=jdbc:mysql://localhost:3306/schooldb
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


##############################################
# JPA / Hibernate Settings
# ------------------------
# Controls schema management:
#   none        \u2192 No schema changes
#   validate    \u2192 Validate schema against entities
#   update      \u2192 Update schema automatically
#   create      \u2192 Create schema at startup
#   create-drop \u2192 Create schema at startup and drop at shutdown
#
# Additional options:
# - show-sql: prints SQL queries in logs
# - dialect: SQL dialect for MySQL 8
# - format_sql: formats SQL output for readability
##############################################
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=true


##############################################
# File Upload Settings
# --------------------
# Configure multipart uploads:
# - max-file-size: maximum size of a single file
# - max-request-size: maximum size of the entire request
# - enabled: enables multipart support
##############################################
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
spring.servlet.multipart.enabled=true


##############################################
# Server Settings
# ----------------
# Change default port (8080) if needed.
# Example: 9090
# Context path can also be set if you want
# the app to run under a sub-path.
##############################################
#server.port=9090
#server.servlet.context-path=/studentapp


##############################################
# Application Metadata
# --------------------
# Sets the name of the Spring Boot application.
# Useful for logging, monitoring, and identification.
##############################################
spring.application.name=student-management-system


##############################################
# Logging Settings
# ----------------
# Configure logging levels for packages.
# Example: DEBUG for your app, INFO for Spring.
##############################################
logging.level.com.student=INFO
logging.level.com.student.app=DEBUG
logging.file.name=logs/studentapp.log


##############################################
# Actuator / Monitoring (Optional)
# --------------------------------
# Enables Spring Boot Actuator endpoints for
# health checks and monitoring.
##############################################
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
